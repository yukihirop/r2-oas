---
sudo: false

language: ruby

cache: bundler

rvm:
  - 2.6.5
  - 2.7.8

before_install: gem install bundler

gemfile:
  - Gemfile
bundler_args: "--without development --deployment"

install:
  - bundle install

script:
  - ruby -e "if RUBY_VERSION >= '2.7'; system('bundle exec rubocop --fail-level=W'); end"
  - bundle exec rspec spec
