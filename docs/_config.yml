# Jekyll Configuration for R2-OAS Documentation

title: "R2-OAS Documentation"
description: "OpenAPI documentation generator for Rails"
baseurl: "/r2-oas"
url: "https://yukihirop.github.io"

# Theme
theme: just-the-docs
color_scheme: light

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Search settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Navigation settings
nav_sort: case_insensitive

# External links
aux_links:
  "GitHub Repository":
    - "https://github.com/yukihirop/r2-oas"
